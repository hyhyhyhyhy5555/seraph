services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seraph-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://seraph:seraph@postgres:5432/seraph
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      TRUST_PROXY: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1024}
    ports:
      - "4000:4000"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: seraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seraph
      POSTGRES_USER: seraph
      POSTGRES_PASSWORD: seraph
    ports:
      - "5432:5432"
    volumes:
      - seraph_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seraph -d seraph"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  seraph_postgres_data:
