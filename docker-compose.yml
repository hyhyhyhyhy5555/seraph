services:
  postgres:
    image: postgres:17
    container_name: seraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seraph
      POSTGRES_USER: seraph
      POSTGRES_PASSWORD: seraph
    ports:
      - "5432:5432"
    volumes:
      - seraph_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seraph -d seraph"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  seraph_postgres_data:
