name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CI: "true"
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.example.invalid' }}

jobs:
  package:
    name: Package deployment artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check sources
        run: npm run check

      - name: Build web and backend
        run: npm run build

      - name: Build backend container
        run: docker build --tag seraph-backend:${{ github.sha }} .

      - name: Export backend container
        run: |
          mkdir -p dist/container
          docker save seraph-backend:${{ github.sha }} | gzip > dist/container/seraph-backend.tar.gz

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: seraph-web-${{ github.sha }}
          path: dist/web
          if-no-files-found: error
          retention-days: 30

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: seraph-backend-${{ github.sha }}
          path: |
            dist/backend
            db/migrations
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload backend container
        uses: actions/upload-artifact@v7
        with:
          name: seraph-backend-container-${{ github.sha }}
          path: dist/container/seraph-backend.tar.gz
          if-no-files-found: error
          retention-days: 30
